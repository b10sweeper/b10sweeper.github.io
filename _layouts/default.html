<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Main">
      <a href="{{ '/work/' | relative_url }}"{% if page.url == '/work/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </header>

  <main id="main">
    {% unless page.body_class == 'home' %}
    <div class="wrap">
      <h1 class="page-title">{{ page.title }}</h1>
    </div>
    {% endunless %}
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a class="footer-mail" href="mailto:{{ site.email }}">{{ site.email }}</a>
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
